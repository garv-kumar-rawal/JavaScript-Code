<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
</head>
<body style="background-color: #212121; color: aliceblue;">

    <div>
        <h1>follower is : </h1>
        <h1 id="follower"></h1>
    </div>
    
</body>
<script>
    const xhr = new XMLHttpRequest()
    const requestUrl = "https://api.github.com/users/garv-kumar-rawal"
    xhr.open('GET', requestUrl)
    console.log(xhr.readyState);
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText)  // use the JSON.parse to convert the datatype from string to json
            console.log(data.followers)
            document.getElementById("follower").innerHTML = data.followers
        }   
    }
    xhr.send()
</script>
</html>
