<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Color</title>
    <style>
        .boxColor {
            width: 5cm;
            height: 5cm;
            border: 2px solid black;
            display: flex;
        }

        nav {
            width: 100%;
            height: 27px;
            background-color: #eeeeee;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        /* Navigation Buttons */
        .nav-btn {
            text-decoration: none;
            color: black;
            background-color: #dddddd;

            border: 1px solid #777;
            border-radius: 3px;

            padding: 3px 18px;
            font-size: 10px;
        }
    </style>
</head>

<body style="background-color: #212121;">
    <nav>
        <a href="/07_projects/" class="nav-btn">Home</a>

        <a href="#" target="_blank" class="nav-btn">
            New Tab
        </a>
    </nav>
    <div id="box" class="boxColor"></div>
    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script>
    const colorChanger = function () {
        const hex = "0123456789ABCDEF"
        let color = "#"
        for (let i = 0; i < 6; i++) {
            color += hex[Math.floor(Math.random() * 16)]
        }
        return color
    }

    const colorSetter = function () {
        const boxSelector = document.querySelector("#box")
        boxSelector.style.backgroundColor = colorChanger()
    }

    let colorInterval;
    document.querySelector("#start").addEventListener('click', function () {
        if (!colorInterval) {
            colorInterval = setInterval(colorSetter, 1000)
        }
    })

    document.querySelector("#stop").addEventListener('click', function () {
        clearInterval(colorInterval)
        colorInterval = null;

    })
</script>

</html>
