<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>Your Local Time</title>

  <style>
    body {
      background-color: #212121;
      color: #fff;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navigation Bar */
    nav {
      width: 100%;
      height: 27px;
      background-color: #eeeeee;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    /* Navigation Buttons */
    .nav-btn {
      text-decoration: none;
      color: black;
      background-color: #dddddd;

      border: 1px solid #777;
      border-radius: 3px;

      padding: 3px 18px;
      font-size: 10px;
    }

    .center {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #banner {
      font-size: 20px;
    }

    #clock {
      font-size: 40px;
      background-color: orange;
      padding: 20px 50px;
      margin-top: 10px;
      border-radius: 10px;
      color: black;
    }
  </style>
</head>

<body>
  <nav>
    <a href="/07_projects" class="nav-btn">Home</a>

    <a href="#" target="_blank" class="nav-btn">
      New Tab
    </a>
  </nav>

  <div class="center">
    <div id="banner">
      <span>Your local time</span>
    </div>

    <div id="clock"></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
